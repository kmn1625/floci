k8s_version: "1.37.2"
calico_version: v3.33.0
argocd_version: v3.5.6
lab_cidr: 10.77.0.0/24         # k8s-lab switch, static node IPs (vms/lab-network.ps1)
# Outside 192.168/16 and 172.16/12, where the Hyper-V Default Switch NAT lands (it moves on host restart).
# Calico skips NAT for an address inside its pool: 192.168.0.0/16 cut pod DNS on 14 Nov (outage drill O-10).
pod_cidr: 10.244.0.0/16
service_cidr: 10.96.0.0/12
repo_url: https://github.com/kmn1625/floci.git
repo_revision: main

ansible_user: ubuntu
ansible_ssh_private_key_file: ~/.ssh/lab_ed25519
ansible_ssh_common_args: -o StrictHostKeyChecking=accept-new
