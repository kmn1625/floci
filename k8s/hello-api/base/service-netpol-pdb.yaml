apiVersion: v1
kind: Service
metadata:
  name: hello-api
  namespace: hello
  labels:
    app: hello-api
spec:
  selector:
    app: hello-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Default deny for the namespace; then allow only what hello-api needs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: hello
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hello-api
  namespace: hello
spec:
  podSelector:
    matchLabels:
      app: hello-api
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: hello
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hello-api
  namespace: hello
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: hello-api
