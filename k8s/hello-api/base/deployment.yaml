apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-api
  namespace: hello
  labels:
    app: hello-api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: hello-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      annotations:
        floci-lab/deploy-drill: z1b # deploy drills: a pod-template change, same image
      labels:
        app: hello-api
    spec:
      serviceAccountName: hello-api
      automountServiceAccountToken: false
      # preStop sleep (10 s) + the app's own Shutdown (10 s) must fit in the grace period.
      terminationGracePeriodSeconds: 25
      # A drain moved both replicas onto one worker (1.37 upgrade drill); spread them again
      # when there is room, without blocking scheduling on a one-node lab.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: hello-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hello-api
          image: hello-api # set per overlay (registry + digest)
          imagePullPolicy: IfNotPresent
          # Keep serving while the endpoint removal reaches every node's kube-proxy. Without it
          # a drain cost 7 failed requests in 6 s: SIGTERM closed the listener at once (1.37
          # upgrade drill). 5 s was not enough with the control plane at load 10 on 2 vCPUs: the
          # endpoint removal reached kube-proxy late and 4 requests failed. Native sleep action:
          # the distroless image has no sleep binary.
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_ENV
              value: base
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
