# kubeadm cluster on the lab VMs, deployed by Argo CD from this repo.
# Image published by .github/workflows/hello-api-image.yml (public, ghcr.io), pinned by digest.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: hello-api
    newName: ghcr.io/kmn1625/hello-api
    digest: sha256:4fd7a6c768d26d3514006c0a10fd473c79907dbb9a7d52df90b54e4c56db6ffa # 0.1.1
patches:
  - target:
      kind: Deployment
      name: hello-api
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: kubeadm
