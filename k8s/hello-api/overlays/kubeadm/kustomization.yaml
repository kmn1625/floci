# kubeadm cluster on the lab VMs, deployed by Argo CD from this repo.
# Image published by .github/workflows/hello-api-image.yml (public, ghcr.io), pinned by digest.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - observability.yaml
images:
  - name: hello-api
    newName: ghcr.io/kmn1625/hello-api
    digest: sha256:4f8c4ee9984acdf6d0a8861263a96cf79920f4ea6ce9e6a27d6dd7ac1f64ec36 # 0.3.0 (overload protection, admin port)
patches:
  - target:
      kind: Deployment
      name: hello-api
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: kubeadm
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://tempo.observability:4318"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: OTEL_SERVICE_NAME, value: hello-api}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: OTEL_RESOURCE_ATTRIBUTES, value: "deployment.environment=kubeadm-lab"}
      # 0.3.0 (vms/drills/outage): probes on a plain admin port, outside the request limit, so a busy
      # pod is never restarted by its own liveness probe (devops-project §K021). Over 64 requests in
      # flight the app answers 503 + Retry-After instead of queueing. /metrics stays on http as well.
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: ADMIN_PORT, value: "8081"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: MAX_INFLIGHT, value: "64"}
      - op: add
        path: /spec/template/spec/containers/0/ports/-
        value: {name: admin, containerPort: 8081}
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe/httpGet/port
        value: admin
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/httpGet/port
        value: admin
