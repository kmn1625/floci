# kubeadm cluster on the lab VMs, deployed by Argo CD from this repo.
# Image: ghcr.io/kmn1625/hello-api, published by .github/workflows/hello-api-image.yml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: hello-api
    newName: ghcr.io/kmn1625/hello-api
    newTag: 0.1.1 # switch to digest once the workflow has published it
patches:
  - target:
      kind: Deployment
      name: hello-api
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: kubeadm
