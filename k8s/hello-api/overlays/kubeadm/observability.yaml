# Observability wiring for hello-api on the kubeadm cluster: traces out to Tempo, and a scrape
# path for Prometheus when the optional metrics stack is on (k8s/argocd/optional/metrics.yaml).
# The namespace is default-deny: let Prometheus scrape in, and traces out to Tempo.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hello-api-observability
  namespace: hello
spec:
  podSelector:
    matchLabels:
      app: hello-api
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: tempo
      ports:
        - port: 4318
