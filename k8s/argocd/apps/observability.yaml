# Observability stack, synced by Argo CD from the upstream Helm charts (pinned).
#   logs:    Loki (single binary) <- Grafana Alloy (reads pod logs through the Kubernetes API)
#   traces:  Tempo (monolithic)   <- apps send OTLP/HTTP to tempo.observability:4318
#   metrics: off by default. kube-prometheus-stack (Prometheus, Grafana, ...) is in
#            k8s/argocd/optional/metrics.yaml: on 2 vCPU / 2 GB workers it starved the nodes
#            (liveness kills, NotReady workers, 16 Nov). Turn on: kubectl apply -f that file.
# Lab sizing: no persistent volumes (emptyDir), short retention.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 7.5.0
    helm:
      releaseName: loki
      valuesObject:
        deploymentMode: SingleBinary
        loki:
          auth_enabled: false
          commonConfig: {replication_factor: 1}
          storage: {type: filesystem}
          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index: {prefix: loki_index_, period: 24h}
          limits_config: {retention_period: 48h}
        singleBinary:
          replicas: 1
          persistence: {enabled: false}
          # with persistence off, chart 7.5.0 mounts nothing at /var/loki and the root
          # filesystem is read-only -> "mkdir /var/loki: read-only file system"
          extraVolumes: [{name: loki-data, emptyDir: {}}]
          extraVolumeMounts: [{name: loki-data, mountPath: /var/loki}]
          resources: {requests: {cpu: 50m, memory: 192Mi}, limits: {memory: 512Mi}}
        read: {replicas: 0}
        write: {replicas: 0}
        backend: {replicas: 0}
        gateway: {enabled: false}
        chunksCache: {enabled: false}
        resultsCache: {enabled: false}
        lokiCanary: {enabled: false}
        test: {enabled: false}
        minio: {enabled: false}
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [ServerSideApply=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: tempo
    targetRevision: 1.24.4
    helm:
      releaseName: tempo
      valuesObject:
        tempo:
          retention: 24h
          receivers:
            otlp:
              protocols:
                grpc: {endpoint: "0.0.0.0:4317"}
                http: {endpoint: "0.0.0.0:4318"}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 384Mi}}
        persistence: {enabled: false}
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [ServerSideApply=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 1.15.0
    helm:
      releaseName: alloy
      valuesObject:
        controller: {type: deployment, replicas: 1}  # one tailer via the API, so no duplicate lines
        alloy:
          resources: {requests: {cpu: 20m, memory: 96Mi}, limits: {memory: 256Mi}}
          configMap:
            content: |
              discovery.kubernetes "pods" {
                role = "pod"
              }
              discovery.relabel "pods" {
                targets = discovery.kubernetes.pods.targets
                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app"]
                  target_label  = "app"
                }
              }
              loki.source.kubernetes "pods" {
                targets    = discovery.relabel.pods.output
                forward_to = [loki.write.default.receiver]
              }
              loki.write "default" {
                endpoint {
                  url = "http://loki.observability:3100/loki/api/v1/push"
                }
              }
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated: {prune: true, selfHeal: true}
