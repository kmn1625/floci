apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0" # namespaces + RBAC before workloads
spec:
  project: default
  source:
    repoURL: https://github.com/kmn1625/floci.git
    targetRevision: main
    path: k8s/platform
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false # never auto-delete namespaces or RBAC
      selfHeal: true
