# Publish apps/hello-api to ghcr.io/kmn1625/hello-api for the kubeadm cluster
# (Argo CD pulls it via k8s/hello-api/overlays/kubeadm). Manual on purpose:
# publishing a public image is a deliberate release step.
name: hello-api-image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Image tag (also baked into the binary), e.g. 0.1.1
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commit SHAs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1          # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6         # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Build, scan, then push: a critical CVE must stop a public image before it leaves the runner.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc    # v7.4.0
        with:
          context: apps/hello-api
          load: true
          build-args: VERSION=${{ inputs.version }}
          tags: ghcr.io/kmn1625/hello-api:${{ inputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/kmn1625/floci
            org.opencontainers.image.version=${{ inputs.version }}
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
      - name: Inventory the image
        env:
          VERSION: ${{ inputs.version }}
        run: syft "docker:ghcr.io/kmn1625/hello-api:${VERSION}" -q -o syft-json=sbom.syft.json
      - name: Fail on a critical CVE
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439                # v7.4.2
        with:
          sbom: sbom.syft.json
          fail-build: true
          severity-cutoff: critical
          output-format: table
      - name: Push
        id: build
        env:
          VERSION: ${{ inputs.version }}
        run: |
          docker push "ghcr.io/kmn1625/hello-api:${VERSION}"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "ghcr.io/kmn1625/hello-api:${VERSION}")
          echo "digest=${digest##*@}" >> "$GITHUB_OUTPUT"
      - name: Digest for the kubeadm overlay
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ inputs.version }}
        run: |
          echo "ghcr.io/kmn1625/hello-api:${VERSION} → ${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo "Pin it in k8s/hello-api/overlays/kubeadm/kustomization.yaml (digest: ${DIGEST})" >> "$GITHUB_STEP_SUMMARY"
