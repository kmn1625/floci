# Build and scan the lab images without publishing them: when they change, and nightly, because new
# CVEs appear after an image passed. Scans a syft SBOM: grype pointed at an image misses Go modules
# in some binaries (devops-project rules/security.md §S002). Fails on a critical CVE.
name: image-scan

on:
  push:
    branches: [main]
    paths:
      - apps/hello-api/**
      - toolbox/**
      - .github/workflows/image-scan.yml
  pull_request:
    paths:
      - apps/hello-api/**
      - toolbox/**
      - .github/workflows/image-scan.yml
  schedule:
    - cron: "45 20 * * *"   # 02:15 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: apps/hello-api
            only-fixed: false
          # Local lab tool, no published ports. It needs curl, git and ssh, whose critical CVEs are
          # Debian "won't fix" (no patch exists), so it fails only on criticals that have a fix.
          - context: toolbox
            only-fixed: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1          # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc    # v7.4.0
        with:
          context: ${{ matrix.context }}
          load: true
          tags: floci-scan:ci
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
      - run: syft docker:floci-scan:ci -q -o syft-json=sbom.syft.json
      - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439                # v7.4.2
        with:
          sbom: sbom.syft.json
          fail-build: true
          severity-cutoff: critical
          only-fixed: ${{ matrix.only-fixed }}
          output-format: table
