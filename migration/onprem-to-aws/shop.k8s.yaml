# shop on the lab EKS cluster. The values marked __LIKE_THIS__ come from Terraform outputs (scripts fill them in).
apiVersion: v1
kind: Namespace
metadata:
  name: shop
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Secret
metadata:
  name: shop-db
  namespace: shop
type: Opaque
stringData:
  DATABASE_URL: __DATABASE_URL__
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  namespace: shop
  annotations:
    # Lab images are built here and loaded into k3s with `ctr import`: there is no registry to pull from or name a digest in.
    checkov.io/skip1: CKV_K8S_43=lab image imported into the node, no registry digest
    checkov.io/skip2: CKV_K8S_15=imagePullPolicy Never on purpose, the node holds the only copy
    checkov.io/skip3: CKV_K8S_35=the shop reads DATABASE_URL from its environment; lab password
spec:
  replicas: __REPLICAS__
  # Longer than the liveness window (30 s): a version that turns Ready and then fails liveness stops the rollout
  # instead of replacing every old pod (§K020).
  minReadySeconds: 40
  selector:
    matchLabels:
      app: shop
  template:
    metadata:
      labels:
        app: shop
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30   # >= the preStop below + gunicorn's own shutdown (§K019)
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: shop
          image: shop:__TAG__
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: STORAGE
              value: s3
            - name: S3_BUCKET
              value: __BUCKET__
            - name: S3_ENDPOINT
              value: http://__FLOCI_IP__:4566
            - name: AWS_REGION
              value: us-east-1
            - name: AWS_ACCESS_KEY_ID
              value: floci
            - name: AWS_SECRET_ACCESS_KEY
              value: floci
            - name: SITE
              value: aws
          envFrom:
            - secretRef:
                name: shop-db
          # boto3 is slow to import on a small CPU limit: without this, liveness kills the pod mid-start.
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 40
          # Above the app's 3 second database timeout, or a slow database looks like a dead pod.
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 3
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          # Keep serving until every node stops routing here. Without it each rolling restart of the shop dropped
          # 5 orders with a 502 (merge drill, 8 Nov): the pod stopped while kube-proxy still sent it traffic.
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: shop
  namespace: shop
spec:
  type: NodePort
  selector:
    app: shop
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30080
---
# NetworkPolicies for the shop namespace (§K015): k3s enforces them. Everything is denied, then this opens what
# the shop and the services split out of it use. Ports, not addresses: Postgres and S3 run in Floci, outside the
# cluster, at an address the scripts fill in.
#   in:  8000 on every pod: the edge through the NodePorts, the services calling each other, Prometheus scraping.
#   out: DNS; 8000 to pods in this namespace (shop <-> catalog, files -> shop, sweeper -> catalog);
#        Floci: 4566 (S3) and 7000-7099 (RDS, one port per database instance).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: shop
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shop-traffic
  namespace: shop
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - {port: 8000, protocol: TCP}
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - podSelector: {}
      ports:
        - {port: 8000, protocol: TCP}
    - ports:
        - {port: 4566, protocol: TCP}
        - {port: 7000, endPort: 7099, protocol: TCP}
