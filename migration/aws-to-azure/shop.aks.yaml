# shop on the lab AKS cluster. The values marked __LIKE_THIS__ come from Terraform outputs (deploy.sh fills them in).
apiVersion: v1
kind: Namespace
metadata:
  name: shop
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Secret
metadata:
  name: shop-db
  namespace: shop
type: Opaque
stringData:
  DATABASE_URL: __DATABASE_URL__
  BLOB_KEY: __BLOB_KEY__
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  namespace: shop
  annotations:
    # Lab images are built here and loaded into the node: there is no registry to pull from or name a digest in.
    checkov.io/skip1: CKV_K8S_43=lab image imported into the node, no registry digest
    checkov.io/skip2: CKV_K8S_15=imagePullPolicy Never on purpose, the node holds the only copy
    checkov.io/skip3: CKV_K8S_35=the shop reads DATABASE_URL and BLOB_KEY from its environment; lab secrets
spec:
  replicas: 2
  minReadySeconds: 40   # longer than the liveness window: a Ready-then-dying version stops the rollout (§K020)
  selector:
    matchLabels:
      app: shop
  template:
    metadata:
      labels:
        app: shop
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30   # >= the preStop below + gunicorn's own shutdown (§K019)
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: shop
          image: shop:1.1.1
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: STORAGE
              value: azure
            - name: BLOB_URL
              value: __BLOB_URL__
            - name: BLOB_ACCOUNT
              value: __ACCOUNT__
            - name: BLOB_CONTAINER
              value: uploads
            - name: SITE
              value: azure
          envFrom:
            - secretRef:
                name: shop-db
          # boto3 is slow to import on a small CPU limit: without this, liveness kills the pod mid-start.
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 40
          # Above the app's 3 second database timeout, or a slow database looks like a dead pod.
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 3
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          # Keep serving until every node stops routing here. Without it each rolling restart of the shop dropped
          # 5 orders with a 502 (merge drill, 8 Nov): the pod stopped while kube-proxy still sent it traffic.
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: shop
  namespace: shop
spec:
  type: NodePort
  selector:
    app: shop
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30080
---
# NetworkPolicies for the shop namespace (§K015), as on the EKS lab (migration/shop-split/README.md) with Azure's ports:
#   in:  8000 (the edge through the NodePort).
#   out: DNS; Azure Database for PostgreSQL on 5432 and Floci's Blob endpoint on 4577, outside the cluster.
# Probed on the AKS lab 10 Nov from a shop pod: 5432 and 4577 open, the Kubernetes API and the registry refused (all
# open before). The full drill was not run with it: its Azure database server no longer exists.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: shop
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shop-traffic
  namespace: shop
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - {port: 8000, protocol: TCP}
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - ports:
        - {port: 5432, protocol: TCP}
        - {port: 4577, protocol: TCP}
